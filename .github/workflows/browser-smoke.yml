name: Browser Smoke
on:
  push:
    branches: [main]
  pull_request:
jobs:
  portal-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
        working-directory: apps/customer-web
      - run: npm install --no-audit --no-fund
        working-directory: apps/admin-web
      - run: npm install --no-audit --no-fund
        working-directory: apps/warehouse-web
      - run: npm install --no-audit --no-fund
        working-directory: apps/driver-web
      - run: npm install --no-audit --no-fund
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-traces
          path: e2e/test-results/
