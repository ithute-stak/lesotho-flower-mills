name: Backend Browser E2E
on:
  push:
    branches: [main]
  pull_request:
jobs:
  isolated-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lfm
          POSTGRES_PASSWORD: lfm
          POSTGRES_DB: lfm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lfm -d lfm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://lfm:lfm@127.0.0.1:5432/lfm_test
      AUTH_SECRET: ci-only-synthetic-secret-not-for-production-0123456789
      LFM_E2E_SEED: "true"
      LFM_BACKEND_E2E: "true"
      API_INTERNAL_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r backend/requirements.txt
      - run: cd backend && alembic upgrade head
      - name: Verify customer engagement migrations and reporting regressions
        run: |
          cd backend
          alembic current --check-heads
          PYTHONPATH=. pytest -q tests/test_customer_engagement_management_intelligence.py tests/test_customer_engagement_reporting_kpis.py tests/test_customer_engagement_management_pdf.py tests/test_customer_engagement_review_audit.py tests/test_repeat_order_planning_reviews.py tests/test_repeat_order_cancellations.py
      - name: Seed disposable E2E users
        run: PYTHONPATH=backend python e2e/seed_backend.py
        env:
          CI: "true"
      - run: PYTHONPATH=backend uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/lfm-e2e-backend.log 2>&1 &
      - name: Wait for isolated backend readiness
        run: |
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/lfm-e2e-backend.log
          exit 1
      - run: npm install --no-audit --no-fund
        working-directory: apps/customer-web
      - run: npm install --no-audit --no-fund
        working-directory: apps/admin-web
      - run: npm install --no-audit --no-fund
        working-directory: apps/warehouse-web
      - run: npm install --no-audit --no-fund
        working-directory: apps/driver-web
      - run: npm install --no-audit --no-fund
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test tests/backend-auth.spec.ts tests/role-boundaries.spec.ts tests/finance-denials.spec.ts tests/finance-revocation.spec.ts tests/customer-engagement-management.spec.ts
        working-directory: e2e
        env:
          CI: "true"
      - name: Print backend and test diagnostics on failure
        if: failure()
        shell: bash
        run: |
          echo "=== Backend log (last 200 lines) ==="
          if [ -f /tmp/lfm-e2e-backend.log ]; then tail -n 200 /tmp/lfm-e2e-backend.log; fi
          echo "=== Playwright files ==="
          find e2e/test-results -maxdepth 3 -type f -print 2>/dev/null | head -n 50 || true
          echo "=== PostgreSQL / backend processes ==="
          ps aux | grep -E '[u]vicorn|[p]ytest' || true
      - name: Record release verification evidence
        if: always()
        shell: bash
        run: |
          mkdir -p e2e/release-evidence
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "job_result=${{ job.status }}"
            echo "recorded_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "scope=isolated backend migrations, reporting regression tests, finance denial, browser e2e"
            echo "production_deployment_verified=false"
          } > e2e/release-evidence/backend-browser-e2e.txt
      - name: Upload release verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-browser-release-evidence
          path: e2e/release-evidence/backend-browser-e2e.txt
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-auth-e2e-failures
          path: |
            e2e/test-results/
            /tmp/lfm-e2e-backend.log
