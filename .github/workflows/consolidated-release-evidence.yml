name: Consolidated Release Evidence
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character commit SHA to verify (leave blank for current branch HEAD)
        required: false
        type: string
permissions:
  actions: read
  contents: read
jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release decision logic
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_consolidated_release_evidence.py
      - name: Consolidate exact-SHA push workflow results
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RELEASE_SHA: ${{ inputs.release_sha }}
        run: python scripts/consolidate_release_evidence.py
      - name: Publish release gate summary
        if: always()
        shell: bash
        run: |
          if [ -f release-evidence/consolidated.md ]; then
            cat release-evidence/consolidated.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# LFM release gate — BLOCKED"
              echo "Evidence consolidation did not produce a report. Deployment is not approved."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload pass/fail evidence, including blocked releases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-release-evidence
          path: release-evidence/
          if-no-files-found: warn
          retention-days: 30
