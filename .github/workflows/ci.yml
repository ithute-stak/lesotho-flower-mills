name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  release-gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated release gate test dependencies
        run: python -m pip install pytest
      - name: Validate release decisions and workflow contracts
        run: python -m pytest -q tests/test_consolidated_release_evidence.py
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend pytest -q backend/tests
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lfm
          POSTGRES_PASSWORD: lfm
          POSTGRES_DB: lfm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lfm -d lfm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://lfm:lfm@localhost:5432/lfm_test
      LFM_TEST_DATABASE_URL: postgresql+psycopg://lfm:lfm@localhost:5432/lfm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: cd backend && alembic upgrade head
      - run: PYTHONPATH=backend pytest -q backend/tests/integration
  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [customer-web, admin-web, warehouse-web, driver-web]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Upload frontend build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ matrix.app }}-diagnostics
          path: |
            apps/${{ matrix.app }}/npm-debug.log
            apps/${{ matrix.app }}/.next/build-manifest.json
          if-no-files-found: ignore
          retention-days: 7
