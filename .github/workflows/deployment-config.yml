name: Deployment Config
on:
  push:
    branches: [main]
  pull_request:
jobs:
  compose-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate combined Compose syntax and variables
        env:
          POSTGRES_DB: lfm_test
          POSTGRES_USER: lfm_ci
          POSTGRES_PASSWORD: ci-only-not-production
          DATABASE_URL: postgresql+psycopg://lfm_ci:ci-only-not-production@db:5432/lfm_test
          AUTH_SECRET: ci-only-random-looking-test-key-0123456789
          ACME_EMAIL: ci@example.invalid
          LFM_CUSTOMER_DOMAIN: customer.example.invalid
          LFM_ADMIN_DOMAIN: admin.example.invalid
          LFM_WAREHOUSE_DOMAIN: warehouse.example.invalid
          LFM_DRIVER_DOMAIN: driver.example.invalid
        run: |
          docker compose -f compose.yaml -f compose.production.yaml -f compose.https.yaml config --quiet
          docker compose -f compose.yaml -f compose.production.yaml config --quiet
          docker compose -f compose.yaml -f compose.production.yaml -f compose.internal-gateway.yaml config --quiet
      - name: Validate actual Caddy HTTPS configuration
        env:
          ACME_EMAIL: ci@example.invalid
          LFM_CUSTOMER_DOMAIN: customer.example.invalid
          LFM_ADMIN_DOMAIN: admin.example.invalid
          LFM_WAREHOUSE_DOMAIN: warehouse.example.invalid
          LFM_DRIVER_DOMAIN: driver.example.invalid
        run: |
          docker run --rm \
            -e ACME_EMAIL -e LFM_CUSTOMER_DOMAIN -e LFM_ADMIN_DOMAIN \
            -e LFM_WAREHOUSE_DOMAIN -e LFM_DRIVER_DOMAIN \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm \
            -e ACME_EMAIL -e LFM_CUSTOMER_DOMAIN -e LFM_ADMIN_DOMAIN \
            -e LFM_WAREHOUSE_DOMAIN -e LFM_DRIVER_DOMAIN \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null
      - name: Verify staging preflight accepts safe settings and rejects unsafe ones
        env:
          POSTGRES_DB: lfm_test
          POSTGRES_USER: lfm_ci
          POSTGRES_PASSWORD: ci-only-not-production
          DATABASE_URL: postgresql+psycopg://lfm_ci:ci-only-not-production@db:5432/lfm_test
          AUTH_SECRET: ci-only-random-looking-test-key-0123456789
          ACME_EMAIL: ci@example.invalid
          LFM_CUSTOMER_DOMAIN: customer.example.invalid
          LFM_ADMIN_DOMAIN: admin.example.invalid
          LFM_WAREHOUSE_DOMAIN: warehouse.example.invalid
          LFM_DRIVER_DOMAIN: driver.example.invalid
          LFM_SANDBOX_PAYMENTS_ENABLED: "false"
          LFM_ITHUTE_PAY_CHECKOUT_ENABLED: "false"
          LFM_E2E_SEED: "false"
        run: |
          bash deploy/staging_preflight.sh
          if LFM_SANDBOX_PAYMENTS_ENABLED=true bash deploy/staging_preflight.sh; then
            echo "Unsafe sandbox payments were accepted" >&2
            exit 1
          fi
          if LFM_ITHUTE_PAY_CHECKOUT_ENABLED=true bash deploy/staging_preflight.sh; then
            echo "Unsafe IthutePay checkout was accepted" >&2
            exit 1
          fi
          if LFM_E2E_SEED=true bash deploy/staging_preflight.sh; then
            echo "Unsafe E2E seeding was accepted" >&2
            exit 1
          fi
          if LFM_ENV=production bash deploy/staging_preflight.sh; then
            echo "Production environment was accepted as staging" >&2
            exit 1
          fi
          if AUTH_SECRET= bash deploy/staging_preflight.sh; then
            echo "Missing authentication secret was accepted" >&2
            exit 1
          fi
      - name: Verify staging startup refuses deployment without explicit approval
        run: |
          if bash deploy/staging_up.sh; then
            echo "Staging script accepted missing --deploy-staging flag" >&2
            exit 1
          fi
          if COMPOSE_PROJECT_NAME=lfm-staging-test bash deploy/staging_up.sh --deploy-staging; then
            echo "Staging script accepted missing operator approval" >&2
            exit 1
          fi
          if LFM_STAGING_APPROVED=yes COMPOSE_PROJECT_NAME=lfm-production bash deploy/staging_up.sh --deploy-staging; then
            echo "Staging script accepted a production-like Compose project" >&2
            exit 1
          fi
